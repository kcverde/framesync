[project]
name = "framesync"
version = "0.1.2"
description = "Simple local photo sync for Samsung The Frame"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6-Essentials>=6.10,<7",
    "Pillow>=12,<13",
    "samsungtvws==3.0.7",
    "urllib3>=2.3,<3",
]

[project.scripts]
framesync = "framesync.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15,<1",
]
packaging = [
    "pyinstaller>=6.20,<7",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
